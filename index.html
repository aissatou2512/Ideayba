<script>

let S={items:[]},view='dash',mode='grid',F={q:'',type:'',cat:'',status:'',pri:'',date:''},cur={},mem=false;
function clean(h){const t=document.createElement('template');t.innerHTML=String(h||'');t.content.querySelectorAll('*').forEach(e=>{if(!/^(H2|H3|P|UL|OL|LI|B|I|U|STRONG|EM|DIV|BR|SPAN|BLOCKQUOTE|A)$/.test(e.tagName))e.remove();else{const h=e.tagName==='A'&&e.getAttribute('href');[...e.attributes].forEach(a=>e.removeAttribute(a.name));if(h&&/^https?:\/\//i.test(h))e.setAttribute('href',h)}});return t.innerHTML}

if(x.type!=='project')return x;const T={text:1,image:1,table:1,callout:1,checklist:1,link:1,file:1,divider:1};
if(!Array.isArray(x.blocks)){const bl=[],add=h=>bl.push({id:uid(),type:'text',html:h});if(x.plan)add(clean(x.plan));[['problem','Problème identifié'],['solution','Solution proposée'],['target','Public cible'],['model','Modèle économique'],['budget','Budget estimé'],['links','Liens et ressources'],['notes','Notes personnelles']].forEach(([k,l])=>x[k]&&add(`<h2>${l}</h2><p>${esc(x[k]).replace(/\n/g,'<br>')}</p>`));x.blocks=bl;['plan','problem','solution','target','model','budget','links','notes'].forEach(k=>delete x[k])}

const btxt=x=>((x.blocks||[]).map(b=>[b.html,b.title,b.caption,b.url,b.desc,b.name,(b.rows||[]).flat().join(' '),(b.items||[]).map(i=>i.t).join(' ')].join(' ')).join(' ')+' '+(x.plan||'')+' '+((x.steps||[]).map(s=>s.t).join(' '))).replace(/<[^>]*>/g,' ');

const sb=window.supabase&&window.CFG&&CFG.url&&!/VOTRE/.test(CFG.url+CFG.key)?supabase.createClient(CFG.url,CFG.key):null;
let U=null,snap=new Map(),busy=false,again=false,dirty=false;

const row=x=>({user_id:U.id,id:x.id,type:x.type,title:x.title||'',favorite:!!x.fav,archived:!!x.arch,data:x,created_at:vd(x.created),updated_at:vd(x.updated)});

const paths=a=>new Set(a.flatMap(x=>[...(x.blocks||[]).map(b=>b.path),x.cover&&x.cover.path].filter(Boolean))),vd=d=>isNaN(Date.parse(d))?new Date().toISOString():d;let refd=new Set();
async function sync(){if(busy){again=true;return}busy=true;setSt('Enregistrement…','w');try{const cur=new Map(S.items.map(x=>[x.id,JSON.stringify(x)])),up=S.items.filter(x=>snap.get(x.id)!==cur.get(x.id)),del=[...snap.keys()].filter(id=>!cur.has(id)),np=paths(S.items);
